version: '3.8'

# Development environment Docker Compose configuration
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # PostgreSQL database (development)
  postgres:
    image: postgres:15-alpine
    container_name: crawler_postgres_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-crawler_dev_db}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Use different port to avoid conflicts
    networks:
      - crawler_dev_network

  # Redis (development)
  redis:
    image: redis:7-alpine
    container_name: crawler_redis_dev
    ports:
      - "6380:6379"  # Use different port
    networks:
      - crawler_dev_network

  # Backend (development mode - hot reload)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crawler_backend_dev
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-dev_user}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-crawler_dev_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DEBUG=${DEBUG:-true}
      - USE_CELERY=${USE_CELERY:-false}  # Celery is optional in development
    depends_on:
      - postgres
      - redis
    ports:
      - "8001:8000"  # Use different port
    volumes:
      - ./backend:/app/backend:ro  # Read-only mount, enables hot reload
      - ./core:/app/core:ro
      - ./crawlers:/app/crawlers:ro
      - ./outputs:/app/outputs
    networks:
      - crawler_dev_network

networks:
  crawler_dev_network:
    driver: bridge

volumes:
  postgres_dev_data:
