services:
  - type: web
    name: crawler-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: USE_CELERY
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: crawler-postgres
          property: connectionString
      - key: POSTGRES_URL
        fromDatabase:
          name: crawler-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: crawler-redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: FIRECRAWL_BASE_URL
        value: https://api.firecrawl.dev

  - type: redis
    name: crawler-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: crawler-postgres
    plan: starter
    databaseName: crawler_db
    user: crawler_user
